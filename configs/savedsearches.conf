# ============================================================================
# SOC-HOME-LAB — Splunk Saved Searches / Alerts (detection content)
# ----------------------------------------------------------------------------
# Indexer location:  /opt/splunk/etc/apps/search/local/savedsearches.conf
# Apply with:        /opt/splunk/bin/splunk restart
# Or create via GUI: Splunk Web -> Settings -> Searches, reports, and alerts
#
# Each search mirrors the production-ready SPL kept in ../queries/*.spl and is
# mapped to a simulation in ../simulations/. MITRE ATT&CK IDs are noted per
# search. Saved searches run on a schedule; alert actions can be enabled per
# search (e.g. alert_webhook / email / script) — in the lab we review them in
# the Triggered Alerts view.
# ============================================================================

# ----------------------------------------------------------------------------
# SIM-01 — AD Enumeration / Reconnaissance (T1087.002, T1069.002)
# Elevation of access attempts against AD objects (4662/4661)
# ----------------------------------------------------------------------------
[AD Enumeration - Object Access 4662 4661]
search = index=main sourcetype="WinEventLog:Security" EventCode=4662 OR EventCode=4661 | stats count by Account_Name, Object_Type, Source_Network_Address | sort - count
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.severity = 3
alert.suppress = 0
description = Detects Active Directory object access enumeration (EventCode 4662/4661). MITRE ATT&CK: T1087.002, T1069.002. Maps to SIM-01.

# ----------------------------------------------------------------------------
# SIM-02 — Brute Force -> Potential Compromise (T1110.001, T1078)
# Failed logon burst followed by successful logon from the same source
# ----------------------------------------------------------------------------
[Brute Force - 4625 4624 Correlation]
search = index=main sourcetype="WinEventLog:Security" (EventCode=4625 OR EventCode=4624) | stats count(eval(EventCode=4625)) as Failed_Logons, count(eval(EventCode=4624)) as Successful_Logons by Account_Name, Source_Network_Address | where Failed_Logons > 5 | eval Status=if(Successful_Logons>0, "CRITICAL: Potential Compromise After Brute Force", "WARNING: Brute Force Attempt") | table Account_Name, Source_Network_Address, Failed_Logons, Successful_Logons, Status
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.severity = 4
alert.suppress = 0
description = Detects brute-force password attacks (Hydra-style) and flags confirmed compromise when a successful logon follows the burst. MITRE ATT&CK: T1110.001, T1078. Maps to SIM-02.

# ----------------------------------------------------------------------------
# SIM-03 — Suspicious PowerShell Execution (T1059.001, T1105, T1140)
# Sysmon process creation with download/encoded/obfuscated PowerShell
# ----------------------------------------------------------------------------
[Suspicious PowerShell - Sysmon EventCode 1]
search = index=main sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 | search Image="*powershell.exe" (CommandLine="*DownloadString*" OR CommandLine="*EncodedCommand*" OR CommandLine="*bypass*") | table _time, host, User, Image, CommandLine, ParentCommandLine
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.severity = 4
alert.suppress = 0
description = Detects suspicious PowerShell activity: download cradles, encoded commands, execution-policy bypass. MITRE ATT&CK: T1059.001, T1105, T1140. Maps to SIM-03.

# ----------------------------------------------------------------------------
# SIM-04 — Account Creation & Group Elevation (T1136.001, T1098, T1078)
# New user accounts and privileged group additions (classic backdoor accounts)
# ----------------------------------------------------------------------------
[Persistence - Account Creation and Group Elevation]
search = index=main sourcetype="WinEventLog:Security" (EventCode=4720 OR EventCode=4732 OR EventCode=4728) | eval Action=case(EventCode==4720, "User Account Created", EventCode==4732, "Added to Local Admin Group", EventCode==4728, "Added to Global Admin Group") | table _time, Action, TargetUserName, MemberName, SubjectUserName
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert.severity = 4
alert.suppress = 0
description = Detects attacker persistence via rogue account creation (4720) and privileged group membership additions (4732/4728). MITRE ATT&CK: T1136.001, T1098, T1078. Maps to SIM-04.

# ----------------------------------------------------------------------------
# SIM-05 — Audit Log Wiped (T1070.001)
# The single loudest anti-forensics signal a Windows host can emit
# ----------------------------------------------------------------------------
[Defense Evasion - Audit Log Cleared 1102]
search = index=main sourcetype="WinEventLog:Security" EventCode=1102 | table _time, host, Account_Name, Domain_Name, Log_Name
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.severity = 5
alert.suppress = 0
description = Detects Windows audit log clearing (EventCode 1102). The event survives the wipe and names the account that cleared it. MITRE ATT&CK: T1070.001. Maps to SIM-05.

# ----------------------------------------------------------------------------
# SIM-06 — EICAR Test-File Write (T1204.002, T1105)
# Harmless industry-standard AV test file used to prove malware delivery detection
# ----------------------------------------------------------------------------
[Malware Test - EICAR File Creation Sysmon 11]
search = index=main sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11 | search TargetFilename="*.eicar*" OR TargetFilename="*eicar.com*" | table _time, Image, TargetFilename, User
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.severity = 4
alert.suppress = 0
description = Detects EICAR anti-malware test file writes via Sysmon file-create events. MITRE ATT&CK: T1204.002, T1105. Maps to SIM-06.
