# ---------------------------------------------------------------
# Splunk Universal Forwarder — OUTPUTS (ship to the Splunk Enterprise indexer)
# File location:  C:\Program Files\SplunkUniversalForwarder\etc\system\local\outputs.conf
# Applied with:   "C:\Program Files\SplunkUniversalForwarder\bin\splunk.exe" restart
# Replace <UBUNTU_SPLUNK_IP> with your Splunk server IP (e.g. 192.168.1.25)
# ---------------------------------------------------------------

[tcpout]
defaultGroup = primary_indexers

[tcpout:primary_indexers]
server = <UBUNTU_SPLUNK_IP>:9997
