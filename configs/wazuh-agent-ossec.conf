<!--
  Wazuh Agent configuration (Windows endpoint: 192.168.1.11)
  File location on the endpoint: C:\Program Files (x86)\ossec-agent\ossec.conf
  Restart the agent after editing:  NET STOP WazuhSvc && NET START WazuhSvc

  This is the real log-forwarding pipeline used in the lab: native Windows event
  channels are shipped to the Wazuh manager over TLS — not uploaded as flat files.
-->
<ossec_config>

  <!-- ================= Manager connection ================= -->
  <client>
    <server>
      <address>192.168.1.25</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- Agent name as it appears in the dashboard -->
  <client_buffer>
    <disabled>no</disabled>
  </client_buffer>

  <!-- ================= Event channels ================= -->

  <!-- Windows Security log: 4624/4625 logons, 4688 process creation,
       4698 scheduled task created, 4720 account created, 1102 audit log cleared -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
  </localfile>

  <!-- Sysmon: EID 1 process creation, 3 network connect, 7 image load,
       11 file create, 12/13 registry, 22 DNS query -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <!-- PowerShell classic log: script block logging (4104), pipeline execution -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Windows PowerShell</location>
  </localfile>

  <!-- Windows Defender: 1116 malware detected, 1117 action taken -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
  </localfile>

  <!-- ================= Policy ================= -->
  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>
