# ---------------------------------------------------------------
# Splunk Universal Forwarder — INPUTS (Windows Server / Domain Controller)
# File location:  C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Applied with:   "C:\Program Files\SplunkUniversalForwarder\bin\splunk.exe" restart
# Collects: Security log (incl. AD audit events), System log, Sysmon (XML)
# ---------------------------------------------------------------

[WinEventLog://Security]
disabled = 0
start_from = oldest
current_only = 0
evt_resolve_ad_obj = 1
checkpointInterval = 5
index = main

[WinEventLog://System]
disabled = 0
index = main

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = main
renderXml = true
